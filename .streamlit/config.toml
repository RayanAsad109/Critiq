[theme]
base = "dark"
# Screening room: velvet curtain, brass rails, projector light.
backgroundColor = "#1C0F17"           # velvet
secondaryBackgroundColor = "#2A1722"  # curtain
borderColor = "#45293A"               # seam
primaryColor = "#D9A956"              # brass
textColor = "#F2E8DA"                 # projector light
linkColor = "#D9A956"

# Geist for body text, buttons, pills, labels and inputs (400 and 500 only);
# Instrument Serif for headings and film titles. Instrument Serif has one weight (400),
# so headings get their hierarchy from size, never from (faked) bold.
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap"
headingFont = "Instrument Serif:https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
headingFontWeights = [400, 400, 400, 400, 400, 400]
# it runs small and thin, so it's set larger than Newsreader was
headingFontSizes = ["3.3rem", "2.7rem", "2.2rem", "1.8rem", "1.4rem", "1.15rem"]
baseFontSize = 16
baseFontWeight = 400
# Archivo is loaded through codeFont, but only used for signage in ui.py:
# the CRITIQ marquee, ticket-stub ratings and match badges.
codeFont = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap"

baseRadius = "6px"
buttonRadius = "4px"
showWidgetBorder = true

[client]
toolbarMode = "minimal"
